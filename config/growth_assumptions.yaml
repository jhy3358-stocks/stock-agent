# 중소형 성장주 적정가(Growth FV) 모듈 가정값.
# docs/growth_valuation_spec.md §8 그대로. src/growth_valuation.py가 읽는다.
# 모든 가정값(P, 멀티플, TAM, 점유율)은 결과를 2~3배 흔들 수 있으므로
# 리포트에는 항상 "가정 기반 추정" 문구를 함께 표기할 것 (spec §10).

defaults:
  erp: 0.05
  r_floor: 0.12
  g_cap: 1.0
  decay: 0.75
  sbc_rate: 0.04
  issue_discount: 0.20
  tax: 0.21

SPCX:
  peer_beta: 1.2            # 상장 1년 미만
  P: 0.9
  n_override: 5
  R_n_override: 150000      # $M, 2031
  net_cash_n: -3300          # $M, 애널리스트 전망
  ma_new_shares: 400         # M주, Cursor 인수 가정
  segments:
    - {name: connectivity, share: 0.40, ebitda_margin: 0.60, multiple: 12}
    - {name: ai,           share: 0.50, ebitda_margin: 0.35, multiple: 10}
    - {name: space,        share: 0.10, ebitda_margin: 0.25, multiple: 15}

IONQ:
  peer_beta: 1.8
  P: 0.6
  n_override: 5
  burn_total: 1500          # $M
  segments:
    - {name: quantum, R_n: 1600, ev_s: 7, gm_ratio: 0.9}
    - {name: foundry, R_n: 500,  ev_s: 2, gm_ratio: 1.0}

RGTI:
  P: 0.3
  n_override: 10
  tam_T: 50000              # $M, 2036 양자컴퓨팅 시장 가정
  market_share: 0.03
  op_margin: 0.25
  pe_mature: 25
  L: 200                    # $M, T 시점 IP 매각가치 가정
  burn_total: 1400          # $M

# RKLB(로켓랩): TTM 매출 $769M(2026-06-30 기준 4개 분기 합), TTM EBITDA 마진
# 약 -14%로 2단계(매출 있음/이익 없음)에 해당. Launch+Space Systems를 하나로
# 묶은 단일 세그먼트로 단순화했다 (사업부 정보가 부족한 건 아니지만, spec처럼
# 이질적 사업부로 쪼갤 근거가 약해 하나로 처리).
# n=6, R_n=$4,262M은 §3.2 규칙(g0=매출성장률 62%, decay 0.75, g<=15%까지)을
# 손으로 미리 계산해 넣은 값 - stage2/3은 이 모듈이 실행 시점에 자동으로
# 재계산하지 않고 config의 정적 값을 쓴다(IONQ/RGTI와 동일한 설계).
# ev_s=4(성숙기 항공우주/발사 서비스 매출멀티플 추정), gm_ratio=1.0(자사
# 매출총이익률이 이미 피어 성숙기 수준에 근접했다고 가정) 모두 거친 추정치라
# 주기적 재검토가 필요하다. P=0.7은 이미 매출을 내고 있고 현금 $2B로 러웨이가
# 넉넉해 기본값(0.6)보다 조금 높게 잡았다.
RKLB:
  P: 0.7
  n_override: 6
  segments:
    - {name: launch_and_space_systems, R_n: 4262, ev_s: 4, gm_ratio: 1.0}
