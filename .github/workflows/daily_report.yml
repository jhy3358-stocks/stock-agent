name: Daily Stock Report

on:
  # GitHub의 자체 schedule(cron) 트리거는 부하가 몰리면 몇 시간씩 지연될 수 있어
  # (2026-07-07 실제로 4시간+ 지연 확인) 제거하고, 외부 스케줄러(cron-job.org)가
  # GitHub API로 workflow_dispatch를 호출하는 방식으로 대체했다.
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  send-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run report pipeline
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          KAKAO_NEW_TOKEN_FILE: ${{ runner.temp }}/new_kakao_refresh_token.txt
        run: python -m src.main

      # 카카오가 access_token 갱신 시 refresh_token을 새로 발급(로테이션)하면
      # src/main.py가 그 값을 이 파일에 남긴다. 존재하면 GitHub Secrets에 반영해
      # 다음 실행부터 새 값을 쓰도록 한다. Secrets 쓰기는 기본 GITHUB_TOKEN 권한
      # 밖이라 별도 PAT(secrets: write 권한, KAKAO_TOKEN_ROTATOR_PAT)가 필요하다.
      - name: Rotate Kakao refresh token if reissued
        if: always()
        env:
          GH_TOKEN: ${{ secrets.KAKAO_TOKEN_ROTATOR_PAT }}
          TOKEN_FILE: ${{ runner.temp }}/new_kakao_refresh_token.txt
        run: |
          if [ ! -s "$TOKEN_FILE" ]; then
            echo "새로 발급된 refresh_token 없음, 건너뜀"
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::새 refresh_token이 발급됐지만 KAKAO_TOKEN_ROTATOR_PAT 시크릿이 없어 자동 반영하지 못했습니다. 수동으로 KAKAO_REFRESH_TOKEN을 갱신하세요."
            exit 0
          fi
          echo "::add-mask::$(cat "$TOKEN_FILE")"
          gh secret set KAKAO_REFRESH_TOKEN --body "$(cat "$TOKEN_FILE")" --repo "${{ github.repository }}"
          echo "KAKAO_REFRESH_TOKEN 시크릿을 새로 발급된 값으로 갱신했습니다."

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "in:title 리포트 발송 실패" --json number --jq '.[0].number')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "다시 실패했습니다: $RUN_URL"
          else
            gh issue create --repo "${{ github.repository }}" --title "⚠️ Daily Stock Report 발송 실패" \
              --body "워크플로우 실행이 실패했습니다: $RUN_URL

이 이슈가 닫히지 않은 동안은 실패할 때마다 댓글로만 추가됩니다. 원인을 해결한 뒤 이 이슈를 닫아주세요."
          fi

      - name: Commit updated report page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "docs: update daily stock report"
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected, rebasing onto latest main and retrying..."
            git fetch origin main
            git rebase origin/main -X ours
          done
          echo "Failed to push after retries"
          exit 1
